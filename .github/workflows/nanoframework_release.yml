name: Release Nanoframework

on:
  release:
    types: [published]

defaults:
  run:
    shell: pwsh
jobs:
  Build:
    strategy:
      matrix:
        configuration: [Release]
    name: Build NanoFramework SLN
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      solution: 'Meteostanice.sln'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 9.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v5.0.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # https://github.com/NuGet/setup-nuget
      - name: Install NuGet client
        uses: nuget/setup-nuget@v2.0.1
        with:
          nuget-version: 'latest'
          
      - name: Install Nanoframework Extension
        uses: nanoframework/nanobuild@v1.18
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.githubAuth }}
          
      - name: Restore nugets
        run: nuget restore ${{ env.solution }} -ConfigFile nuget.config
        
      - name: Cache SonarCloud packages
        uses: actions/cache@v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4.3.0
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
          
      - name: Build Nanoframework and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          Configuration: ${{ matrix.configuration }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"TekuSP_Meteostanice-CSharp" /o:"tekusp" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.scanner.scanAll=false /d:sonar.host.url="https://sonarcloud.io"
           msbuild ${{ env.solution }} /p:Configuration=$env:Configuration
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      
      - name: Set version environment variable
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          # Check if the tag starts with 'v' and remove it
          if ($tagName.StartsWith("v")) {
              $version = $tagName.Substring(1)
          } else {
              $version = $tagName
          }
          
          Write-Host "The original tag name was: $tagName"
          Write-Host "The processed version is: $version"
          
          # Set the environment variable for subsequent steps in the same job
          echo "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh # Explicitly use PowerShell Core (default on windows-latest for 'run')

      
      - name: Prepare nuget version ${{ env.version }}
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.nuspec'
          search-text: '$version$'
          replacement-text: '${{ env.version }}'
          encoding: 'utf8'
          max-parallelism: 10
      
      - name: Pack nugets
        run: ./GenerateNugets.ps1
        if: ${{ matrix.configuration == 'Release' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5.0.0
        if: ${{ matrix.configuration == 'Release' }}
        with:
          name: TekuSP-Drivers
          path: |
            ${{ github.workspace }}\**\*TekuSP*.nupkg

      - name: Push nugets to Github
        run: |
          nuget sources Add -Name github -Source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -UserName ${{ github.repository_owner }} -Password ${{ secrets.GITHUB_TOKEN }}
          nuget push "**/*TekuSP*.nupkg" -Source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -NoSymbols -SkipDuplicate -ApiKey ${{ secrets.GITHUB_TOKEN }}

      - name: Push nugets to Nuget.org
        run: |
          nuget push "**/*TekuSP*.nupkg" -Source https://api.nuget.org/v3/index.json -NoSymbols -SkipDuplicate -ApiKey ${{ secrets.NUGET_KEY }}
