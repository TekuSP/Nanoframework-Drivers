name: Update Changelog
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
  
jobs:
  updateChangelog:
    runs-on: ubuntu-latest
    name: Update Changelog
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Git Safe Directory
        run: git config --global --add safe.directory "${{ github.workspace }}"
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Resolve changelog range
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          if (([string]::IsNullOrEmpty($tagName)))
          {
             $tagName = "${{ inputs.version }}"
          }

          if ([string]::IsNullOrWhiteSpace($tagName))
          {
             throw "A release tag or version input is required to update the changelog."
          }

          if (-not $tagName.StartsWith("v"))
          {
             $tagName = "v$tagName"
          }

          $previousTag = git tag --sort=-v:refname | Where-Object { $_ -ne $tagName } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previousTag))
          {
             Write-Warning "No previous tag found. Generating the changelog from the initial commit."
             $previousTag = git rev-list --max-parents=0 HEAD
          }

          echo "tagVersion=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "previousTag=$previousTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh # Explicitly use PowerShell Core (default on windows-latest for 'run')

      - name: Validate Git-Iris API key
        env:
          GIT_IRIS_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$GIT_IRIS_API_KEY" ]; then
           echo "::error::OPENAI_API_KEY secret is required for Git-Iris changelog generation."
           exit 1
          fi

      - name: Update Changelog with Git-Iris
        uses: hyperb1iss/git-iris@v2
        with:
          command: changelog
          from: ${{ env.previousTag }}
          to: ${{ env.tagVersion }}
          provider: openai
          api-key: ${{ secrets.OPENAI_API_KEY }}
          output-file: CHANGELOG.md
          update-file: true
          version-name: ${{ env.tagVersion }}
          custom-instructions: |
            Generate a Keep a Changelog style entry for the nanoFramework driver packages.
            Group changes under Added, Changed, Fixed, Deprecated, Removed, and Security where applicable.
            Highlight breaking changes separately at the top of the generated entry.
       
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PR_SECRET }}
          commit-message: update changelog
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          title: Update Changelog
          body: Update changelog to reflect release changes
          branch: update-changelog
          base: master
